# Loft web — the static SPA plus the /api reverse proxy.
#
# Included from the stock image's http{} block (/etc/nginx/conf.d/*.conf), so
# `map` is legal here; anything needing the MAIN context is handled in
# deploy/docker/web.Dockerfile instead.
#
# THE CONTRACT THIS FILE IMPLEMENTS is apps/web/vite.config.ts. In development
# Vite serves the app and proxies `/api` to the gateway; the app's API client is
# built with `baseUrl: "/"` (apps/web/src/api/client.ts), i.e. every request is
# SAME-ORIGIN and relative. So production is not free to put the API somewhere
# else: whatever serves index.html must also answer /api on the same origin, or
# the app 404s on its first call. That is the whole reason this proxy exists,
# and why the path is passed through unrewritten exactly as Vite passes it.

# WebSocket upgrade passthrough. Nothing in apps/web opens a WebSocket today
# (grepped: no `new WebSocket`, no ws:// literal), but the gateway grew WS
# fan-out and the cost of being ready is two lines, whereas the cost of not
# being ready is a silent 400 nobody associates with the proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 8080, not 80: this container runs as the unprivileged `nginx` user (see
    # the Dockerfile) and cannot bind a privileged port. The published host
    # port is ${WEB_PORT:-8080} in docker-compose.yml.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version — it is also what keeps the built-in
    # error pages free of a version string.
    server_tokens off;

    # THE CONTENT-SECURITY-POLICY, written ONCE and referenced four times.
    #
    # It has to be a variable. `add_header` is not additive across levels (see
    # the note on `location = /index.html`), so every location that emits a
    # document has to repeat the whole set — and a 300-character policy
    # transcribed four times is a header that will drift in three of them. One
    # definition, four references, and `scripts/web-smoke.sh` asserts the
    # SERVED value on each of them against one expected string, so a drift
    # cannot pass either.
    #
    # WHY IT IS SAFE TO SHIP NOW, AND WAS NOT BEFORE. This block used to read
    # "deliberately NOT a Content-Security-Policy yet ... nothing in CI drives a
    # real browser against THIS artifact". That was true and is no longer:
    # `scripts/dist-leg.sh` builds the bundle, serves it through THIS FILE
    # (scripts/render-web-nginx.py rewrites only the four container-specific
    # directives and refuses if it has to touch an add_header line), drives a
    # real modelling flow in Chromium, and fails on a single
    # `securitypolicyviolation` event. It runs in CI as e2e.yml's `dist-bundle`
    # job and locally as `just dist-leg`.
    #
    # EVERY SOURCE BELOW IS THERE BECAUSE THE BROWSER DEMANDED IT. The policy
    # this comment used to propose was measured against the real bundle and was
    # wrong in one place, which is precisely the reason the proof came first:
    #   * `font-src 'self'` BLOCKED THE APP'S OWN FONTS. Eight @fontsource
    #     faces are small enough that Vite inlines them into the CSS as
    #     `url(data:font/woff;base64,...)` — measured, 8 of them in
    #     dist/assets/index-*.css — so the faces are not fetched from 'self' at
    #     all. `data:` is required and the page falls back to a system font
    #     without it, which is a legible page that is quietly not our design
    #     system: the failure mode a "did it render?" check cannot see.
    #   * `script-src` carries 'wasm-unsafe-eval' for the kernel-adjacent WASM
    #     the viewport may load; it deliberately does NOT carry 'unsafe-eval'
    #     or 'unsafe-inline', which are what actually buy an attacker anything.
    #   * `style-src 'unsafe-inline'` is unavoidable: React writes `style`
    #     attributes (r3f/drei sizing, the gauges' transforms) and CSP treats
    #     those as inline styles. Narrowing it needs style-src-attr support and
    #     a nonce pipeline the static bundle has no seam for.
    #   * `blob:` on script/worker/img covers r3f worker and texture creation;
    #     `connect-src 'self'` is enough because the API is same-origin by
    #     construction (see the contract note at the top of this file).
    #   * `frame-ancestors 'none'` is the CSP spelling of X-Frame-Options and
    #     is the one browsers actually honour in nested contexts; the older
    #     header stays for agents that do not implement CSP Level 2.
    set $loft_csp "default-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Cheap, non-breaking hardening.
    add_header Content-Security-Policy $loft_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm font/woff font/woff2;

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    #
    # `try_files $uri =404` is load-bearing and is NOT a duplicate of the
    # catch-all below: without it a MISSING asset would fall through to the SPA
    # fallback and return index.html with a 200 and Content-Type text/html. A
    # broken deploy would then look healthy to every probe that checks a status
    # code — the zero-byte-200 failure shape, wearing a bundle's clothes.
    # scripts/compose-smoke.sh asserts on the BODY for the same reason.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $loft_csp always;
        # All THREE server-level headers, not just nosniff — see the note on
        # `location = /index.html` below. This block re-added one of them and
        # therefore silently dropped the other two; harmless for a hashed JS
        # chunk, but a file that documents the discard rule and then half-applies
        # it is worse than one that never mentioned it, because the next reader
        # trusts the note and stops checking the locations under it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The entry document must never be cached, or a client keeps loading the
    # previous build's asset URLs after an upgrade and gets 404s from the rule
    # above.
    #
    # The three server-level headers are REPEATED in every location that emits
    # a document: nginx's `add_header` is not additive across levels — a
    # location with any `add_header` of its own discards ALL inherited ones, so
    # the obvious-looking version of this file silently serves the entry
    # document with no security headers at all.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $loft_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # This service's OWN liveness (the container HEALTHCHECK probes it). It is
    # not the gateway's /healthz — that one lives behind /api's upstream and on
    # the gateway's own published port.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # RESOLVED PER REQUEST, on purpose. A literal `proxy_pass
        # http://gateway:8000` is resolved once at config load and cached for
        # the process lifetime, so a gateway container that restarts with a new
        # IP leaves this proxy 502-ing until nginx is reloaded — and worse,
        # nginx REFUSES TO START at all ("host not found in upstream") if the
        # gateway is not resolvable yet, which makes boot order a coin flip.
        # Putting the upstream in a variable defers resolution to request time;
        # 127.0.0.11 is Docker's embedded DNS server, present on every
        # user-defined network (which is what compose creates).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $loft_gateway "gateway:8000";

        # $request_uri is the ORIGINAL, unrewritten path+query — the same thing
        # Vite's proxy forwards (it rewrites nothing), so /api/v1/parts arrives
        # as /api/v1/parts in both environments.
        proxy_pass http://$loft_gateway$request_uri;

        # Again ALL FOUR, for the discard reason documented on
        # `location = /index.html`. These responses are JSON, so the practical
        # exposure is small — but "small" is an argument about THIS upstream's
        # current content types, not a property of the rule, and the gateway is
        # free to serve a document tomorrow.
        add_header Content-Security-Policy $loft_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The gateway's own geometry ceiling is GEOMETRY_TIMEOUT_S (90 s by
        # default, covering the 40.3 s worst measured cold operation plus the
        # 20 s admission queue). This must be LONGER than that or the proxy
        # would invent a 504 the gateway was about to answer properly.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Stream mesh (GLB) and export (STEP/STL) bodies through rather than
        # spooling them to disk first.
        proxy_buffering off;
        proxy_request_buffering off;

        # STEP/assembly import posts real files. nginx's 1 MB default would
        # reject them with a 413 that never reaches the gateway's own error
        # envelope.
        client_max_body_size 64m;

        # NB the gateway's rate limiter keys on the authenticated USER
        # (services/gateway/src/gateway/ratelimit.py: `limiter.check(str(user.id))`),
        # not on the client address, so funnelling every browser through this
        # one proxy IP does NOT collapse everyone into a shared bucket. If that
        # ever changes, the X-Forwarded-For above is what the gateway would
        # have to start trusting — and trusting it requires knowing the proxy
        # is the only ingress.
    }

    # SPA fallback, LAST: client-side routing means /parts/<id> is a real URL a
    # user can reload or bookmark, and there is no such file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
