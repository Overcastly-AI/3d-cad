[project]
name = "loft-py-kit"
version = "0.1.0"
description = "Shared Python service kit for Loft services (config, logging, health, queue, errors)"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_kit"]
