[project]
name = "loft-py-kit"
version = "0.1.0"
description = "Shared Python service kit for Loft services (config, logging, health, queue, errors)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # The wire DTOs this kit's services serve, split out into their own
    # distribution so a CLIENT of those services (packages/loft-script, and the
    # MCP server after it) can depend on the MODELS without depending on the web
    # server, ORM, task queue and Redis client listed below. The arrow is one-way:
    # nothing under loft_wire may import py_kit, and a test enforces it.
    "loft-wire",
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "arq>=0.26",
    # redis.asyncio backs py_kit.ratelimit (MIT). Already present transitively
    # via arq; pinned here as a direct dependency since py-kit imports it.
    "redis>=5",
    "uvicorn>=0.32",
    # py_kit.db / py_kit.alembic_env (shared persistence plumbing). DB drivers
    # (asyncpg, aiosqlite) stay with the services — py-kit is driver-agnostic.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
loft-wire = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_kit"]
