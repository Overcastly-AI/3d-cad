[project]
name = "loft-py-kit"
version = "0.1.0"
description = "Shared Python service kit for Loft services (config, logging, health, queue, errors)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "arq>=0.26",
    # redis.asyncio backs py_kit.ratelimit (MIT). Already present transitively
    # via arq; pinned here as a direct dependency since py-kit imports it.
    "redis>=5",
    "uvicorn>=0.32",
    # py_kit.db / py_kit.alembic_env (shared persistence plumbing). DB drivers
    # (asyncpg, aiosqlite) stay with the services — py-kit is driver-agnostic.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_kit"]
