[project]
name = "loft-script"
version = "0.1.0"
description = "Loft's public Python scripting API — model parts from code, through the same gateway the web app uses"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # The WIRE TYPES. py_kit.schemas holds the pydantic models the services
    # serve, so the client imports them rather than re-deriving them from the
    # generated OpenAPI — see packages/loft-script/README.md "Where the types
    # come from". This is the ONLY first-party dependency: no gateway, no
    # documents, and emphatically no geometry (the kernel never crosses here).
    "loft-py-kit",
    # BSD-3. The same HTTP client the gateway uses for its own upstream calls,
    # so there is one connection/timeout/TLS behaviour in the repo.
    "httpx2>=2.5",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loft"]
