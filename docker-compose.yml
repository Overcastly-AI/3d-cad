# Loft dev / small-self-host stack (RESEARCH.md §7: compose is the dev path).
#
#   just dev            # this file + docker-compose.dev.yml (hot reload)
#   docker compose up -d --build
#
# Config comes from the environment / an optional `.env` (copy .env.example);
# every variable has a dev-safe default so `docker compose up` works bare.
# Defaults here are for LOCAL DEV ONLY — override them for any real deploy.
# Host ports are all overridable so scripts/dev-instance.sh can run N
# isolated stacks side by side (project loft-<N>, ports offset by N*100).
#
# The web app joins this stack with the "Web shell + first light" backlog
# item (docs/BACKLOG.md); until then the stack is datastores + services.

name: loft

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loft-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-loft}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loft} -d ${POSTGRES_DB:-loft}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loft-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loft-minio-dev-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot bucket bootstrap: geometry results (meshes/exports) land in
  # s3://${S3_BUCKET} (RESEARCH.md §4). Exits 0 after `mc mb --ignore-existing`.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-loft-minio} ${MINIO_ROOT_PASSWORD:-loft-minio-dev-only} &&
      mc mb --ignore-existing local/${S3_BUCKET:-loft}
      "
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_NAME: gateway
    environment:
      PORT: "8000"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Upstream for the /api/v1/geometry/* proxy (readiness reports it
      # best-effort; REDIS_URL etc. get wired when WebSocket fan-out lands).
      GEOMETRY_URL: http://geometry:8002
      # Upstream for the /api/v1/parts aggregation — the gateway verifies the
      # JWT and forwards the user id in X-Loft-User (documents is internal
      # and trusts that header; never expose its port to the public edge).
      DOCUMENTS_URL: http://documents:8001
      # Identity store for /api/v1/auth/* (readiness pings it HARD — a dead
      # DB takes the gateway unready). Schema via alembic, run from the host:
      #   POSTGRES_URL=postgresql://loft:loft-dev-only@localhost:${DB_PORT:-5432}/loft \
      #     uv run alembic -c services/gateway/alembic.ini upgrade head
      POSTGRES_URL: postgresql://${POSTGRES_USER:-loft}:${POSTGRES_PASSWORD:-loft-dev-only}@db:5432/${POSTGRES_DB:-loft}
      # JWT posture — the gateway itself is FAIL-CLOSED (no LOFT_ENV default
      # in the app: unset LOFT_ENV + unset JWT_SECRET refuses to boot). This
      # dev stack opts into dev EXPLICITLY here: LOFT_ENV=dev tolerates an
      # unset JWT_SECRET via a fixed, publicly-known fallback — LOCAL DEV
      # ONLY. For any real deploy set LOFT_ENV (e.g. production) + a real
      # JWT_SECRET (>= 32 chars, `openssl rand -hex 32`); any non-"dev" value
      # refuses to boot without one.
      LOFT_ENV: ${LOFT_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      documents:
        condition: service_healthy
      geometry:
        condition: service_healthy

  documents:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_NAME: documents
    environment:
      PORT: "8001"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Parts store (readiness pings it HARD — a dead DB takes documents
      # unready). Schema via alembic, run from the host:
      #   POSTGRES_URL=postgresql://loft:loft-dev-only@localhost:${DB_PORT:-5432}/loft \
      #     uv run alembic -c services/documents/alembic.ini upgrade head
      POSTGRES_URL: postgresql://${POSTGRES_USER:-loft}:${POSTGRES_PASSWORD:-loft-dev-only}@db:5432/${POSTGRES_DB:-loft}
    ports:
      - "${DOCUMENTS_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy

  geometry:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_NAME: geometry
    environment:
      PORT: "8002"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Setting REDIS_URL flips the readiness check from "skipped";
      # the real ping lands with the arq worker.
      REDIS_URL: redis://redis:6379/0
      # READINESS: geometry is SINGLE-WORKER ONLY until the MinIO-backed mesh
      # store lands. The mesh store is an in-process LRU; WEB_CONCURRENCY>1 (or
      # `docker compose up --scale geometry=N` / k8s replicas>1) 404s evaluated
      # meshes across workers ~(N-1)/N of the time, so the service REFUSES to
      # start on WEB_CONCURRENCY>1 (engineering audit F1, feature-tree.md §7.8).
      # S3_URL/S3_BUCKET are provisioned for that forward swap, not consumed yet.
      S3_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-loft}
    ports:
      - "${GEOMETRY_PORT:-8002}:8002"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  minio-data:
