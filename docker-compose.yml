# Loft dev / small-self-host stack (RESEARCH.md §7: compose is the dev path).
#
#   just dev            # this file + docker-compose.dev.yml (hot reload)
#   docker compose up -d --build
#
# Config comes from the environment / an optional `.env` (copy .env.example);
# every variable has a dev-safe default so `docker compose up` works bare.
# Defaults here are for LOCAL DEV ONLY — override them for any real deploy.
# Host ports are all overridable so scripts/dev-instance.sh can run N
# isolated stacks side by side (project loft-<N>, ports offset by N*100).
#
# The web app joins this stack with the "Web shell + first light" backlog
# item (docs/BACKLOG.md); until then the stack is datastores + services.

name: loft

# Single source of truth for the MinIO/S3 credentials: the MinIO server, the
# minio-init bucket bootstrap, and the geometry service (S3 mesh store) all
# reference these anchors, so the values cannot drift apart (audit G1).
x-minio-credentials:
  user: &minio-user ${MINIO_ROOT_USER:-loft-minio}
  password: &minio-password ${MINIO_ROOT_PASSWORD:-loft-minio-dev-only}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loft-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-loft}
      # ONE DATABASE PER SCHEMA-OWNING SERVICE, created on first boot by
      # deploy/docker/postgres-init (see that script for why sharing one
      # database silently breaks the second service's migrations).
      GATEWAY_DB: ${GATEWAY_DB:-loft_gateway}
      DOCUMENTS_DB: ${DOCUMENTS_DB:-loft_documents}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # `-h 127.0.0.1` on purpose — TCP, not the unix socket: while the entrypoint
    # runs initdb + /docker-entrypoint-initdb.d it serves a socket-only server
    # with listen_addresses='', so a socket probe reports HEALTHY mid-bootstrap
    # and dependents (and `up --wait`) race a server that is about to restart
    # and is not yet reachable over the network. A TCP probe passes only once
    # the real server is accepting the connections the services actually make.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-loft} -d ${POSTGRES_DB:-loft}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: *minio-user
      MINIO_ROOT_PASSWORD: *minio-password
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot bucket bootstrap: geometry results (meshes/exports) land in
  # s3://${S3_BUCKET} (RESEARCH.md §4). Exits 0 after `mc mb --ignore-existing`.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: *minio-user
      MINIO_ROOT_PASSWORD: *minio-password
      S3_BUCKET: ${S3_BUCKET:-loft}
    # $$ defers expansion to the container shell (reads the environment above,
    # which is anchor-sourced from the same credentials the server uses).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\"
      "
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_NAME: gateway
    environment:
      PORT: "8000"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Upstream for the /api/v1/geometry/* proxy (readiness reports it
      # best-effort; REDIS_URL etc. get wired when WebSocket fan-out lands).
      GEOMETRY_URL: http://geometry:8002
      # Upstream for the /api/v1/parts aggregation — the gateway verifies the
      # JWT and forwards the user id in X-Loft-User (documents is internal
      # and trusts that header; never expose its port to the public edge).
      DOCUMENTS_URL: http://documents:8001
      # Identity store for /api/v1/auth/* (readiness pings it HARD — a dead
      # DB takes the gateway unready). Its OWN database (see the db service):
      # the gateway's alembic tree and the documents one both start at
      # revision "0001" in the default alembic_version table. Create the
      # schema with the image's baked-in migrations, no host toolchain:
      #   docker compose run --rm gateway \
      #     alembic -c /app/migrations/alembic.ini upgrade head
      POSTGRES_URL: postgresql://${POSTGRES_USER:-loft}:${POSTGRES_PASSWORD:-loft-dev-only}@db:5432/${GATEWAY_DB:-loft_gateway}
      # JWT posture — the gateway itself is FAIL-CLOSED (no LOFT_ENV default
      # in the app: unset LOFT_ENV + unset JWT_SECRET refuses to boot). This
      # dev stack opts into dev EXPLICITLY here: LOFT_ENV=dev tolerates an
      # unset JWT_SECRET via a fixed, publicly-known fallback — LOCAL DEV
      # ONLY. For any real deploy set LOFT_ENV (e.g. production) + a real
      # JWT_SECRET (>= 32 chars, `openssl rand -hex 32`); any non-"dev" value
      # refuses to boot without one.
      LOFT_ENV: ${LOFT_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      documents:
        condition: service_healthy
      geometry:
        condition: service_healthy

  documents:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_NAME: documents
    environment:
      PORT: "8001"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Parts store (readiness pings it HARD — a dead DB takes documents
      # unready). Its OWN database (see the db service). Create the schema
      # with the image's baked-in migrations, no host toolchain:
      #   docker compose run --rm documents \
      #     alembic -c /app/migrations/alembic.ini upgrade head
      POSTGRES_URL: postgresql://${POSTGRES_USER:-loft}:${POSTGRES_PASSWORD:-loft-dev-only}@db:5432/${DOCUMENTS_DB:-loft_documents}
    # NO host port on purpose (audit G3): documents trusts the gateway-verified
    # X-Loft-User principal header with no signature check, so publishing this
    # port on any non-loopback host is forged-header cross-tenant access. Only
    # the gateway needs the edge; the compose network reaches documents:8001.
    # Local debugging: docker-compose.dev.yml binds it to 127.0.0.1 only.
    depends_on:
      db:
        condition: service_healthy

  geometry:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_NAME: geometry
    environment:
      PORT: "8002"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Setting REDIS_URL flips the readiness check from "skipped";
      # the real ping lands with the arq worker.
      REDIS_URL: redis://redis:6379/0
      # S3/MinIO mesh + drawing-artifact store — ACTIVE whenever S3_URL is set
      # (geometry.main:build_app -> configure_mesh_store): meshes/exports land
      # in s3://${S3_BUCKET} and the store is shared across processes, so
      # build_app LIFTS the single-worker guard — WEB_CONCURRENCY>1 and
      # `--scale geometry=N` are correct here (audit F1/F6). The store
      # authenticates via S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY (GeometrySettings
      # -> boto3); they are REQUIRED against MinIO — without them every mesh
      # put/get 403s and evaluate 500s (audit G1) — and are anchor-sourced from
      # the same MinIO root credentials the server boots with, so they cannot
      # drift. Unsetting S3_URL falls back to the in-process LRU, which
      # re-imposes the single-worker guard (feature-tree.md §7.8).
      S3_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-loft}
      S3_ACCESS_KEY_ID: *minio-user
      S3_SECRET_ACCESS_KEY: *minio-password
    # NO host port on purpose (audit G3): geometry is internal-only — the
    # gateway proxies /api/v1/geometry/* over the compose network
    # (geometry:8002). Local debugging: docker-compose.dev.yml binds it to
    # 127.0.0.1 only.
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  minio-data:
