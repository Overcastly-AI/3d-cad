# Loft CI — THE PER-COMMIT LANE: lint / typecheck / unit tests, contract drift,
# compose validation, and a smoke e2e. Target: under 10 minutes wall-clock.
#
# ── Two lanes (CI-TWO-LANE, 2026-09-30) ─────────────────────────────────────
#
# Every commit used to run all three workflows: this one (~10 min), e2e's nine
# jobs (~40 min) and deploy-path (~5 min plus two image builds). The feedback a
# builder waits on was the 40-minute one. Now:
#   * THIS workflow runs on every push and PR: everything that is cheap and
#     catches the common breakage, plus `e2e smoke` — five specs on the
#     sketch -> extrude -> save -> reload journey (SMOKE_SPECS in
#     scripts/e2e-shard-plan.py says which, and why).
#   * THE FULL LANE, .github/workflows/e2e.yml (named `full`), runs the whole
#     Playwright suite, the dist and short-TTL legs, and deploy-path.yml's
#     Docker jobs. It runs on push to claude/** for the NEWEST TIP only (per-
#     branch group, a newer push cancels the older run), on push/PR to
#     `main`, nightly on the working branch (nightly.yml), and on demand for
#     one commit where dispatch is permitted:
#         gh workflow run e2e.yml --ref <branch> [-f sha=<40-hex sha>]
#     Nothing merges to `main` unless that commit's own `full lane complete`
#     is green.
# What a per-commit green therefore does NOT say: that the specs outside the
# smoke set pass, that the images build, or that backup/restore works. Those
# are the full lane's, and a red there is attributed to the commits since the
# last tip that ran it to completion.
#
# Jobs (all independent, run in parallel):
#   python    — ruff (lint + format), pyright strict
#   pytest    — pytest across the uv workspace as a 4-job matrix, packed by
#               measured duration (scripts/pytest_shards.py); `pytest complete`
#               then proves from the shards' ledgers that every collected test
#               ran exactly once
#   e2e smoke — the smoke specs above against the native stack (~7 min)
#   ts        — eslint + prettier, tsc typecheck, vitest across the pnpm workspace
#   contracts — `just gen-check`: regenerate OpenAPI contracts + TS client into a
#               tempdir and diff against the committed output (fails on drift)
#   compose   — `docker compose config -q` for the base stack and base+dev
#               overlay, plus scripts/check-compose.py (audit G1/G3 invariants:
#               geometry S3 creds == MinIO's; internal services unpublished) and
#               scripts/check-build-context.py (every Dockerfile COPY source
#               survives .dockerignore — the failure `deploy-path` used to find)
#               and scripts/check-workflow-concurrency.py (every push-
#               triggered workflow keys its concurrency group per COMMIT —
#               CI-2) and
#               scripts/check-mutation-markers.py (no mutation/ablation/debug
#               marker labels committed source — docs/RETRO.md §4b) and
#               scripts/check-file-size.py (no source file grows past 1,500
#               lines; the oversized ones may not grow — FILE-SIZE-RATCHET)
#   (doc-tick was removed 2026-09-25 with the same-commit ROADMAP/BACKLOG
#   tick convention it enforced; see CLAUDE.md.)
#   licences  — scripts/check-licences.py over the shared objects in the synced
#               environment (LIC-3), plus a self-test that PROVES the gate
#               fails on the GPL library the OCP wheel vendors
#
# The RUNTIME half of the compose gate lives in
# .github/workflows/deploy-path.yml, which the full lane calls: it builds the
# images and boots the stack. The real-MinIO mesh-store smoke
# (`geometry-minio-smoke`) moved there from this file with CI-TWO-LANE: it
# compiles MinIO from source (~4-5 min cold) on every run, which is the
# Docker-daemon class of cost the per-commit lane no longer pays, and the
# cross-process store it proves is also driven end to end by deploy-path's
# round-trip.
#
# Notes:
# - The geometry golden suite runs inside the `pytest` shards
#   (services/geometry/tests/test_goldens.py), so goldens ARE per-commit.
# - The uv cache is keyed on uv.lock on purpose: when OCP lands in the Python
#   env its wheels are ~700MB, and that cache is what keeps the python and
#   contracts jobs from re-downloading them on every run (CLAUDE.md recipe).
# - The repo is small enough that every job runs on every push; per-package
#   path filtering is a later optimization once job times warrant it.

name: ci

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

concurrency:
  # PUSH: group PER COMMIT, so a commit's run can never be evicted by a later
  # one. PR: group per ref, so a superseded PR push still cancels.
  #
  # Keying on the ref for pushes looked harmless and was not. A concurrency group
  # holds at most one RUNNING plus one PENDING run, so a newer arrival evicts the
  # pending one — and that happens regardless of cancel-in-progress, which only
  # governs runs already holding a runner. Under one pusher that is rare. With
  # four agents pushing (2026-07-30) it became the norm: 5 of 8 consecutive runs
  # came back `cancelled`, including 5794b48, the fix for the very lint failure
  # an audit had just flagged. Net effect: the "every commit green on its own"
  # rule was unenforceable exactly when parallelism made it most valuable, and
  # `cancelled` reads as noise rather than as the missing evidence it is.
  #
  # Per-SHA groups cost more runner minutes. That is the price of the rule, and
  # the alternative was paying for CI that verifies a minority of commits.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.ref)
        || format('ci-sha-{0}', github.sha) }}
  # Cancel superseded runs on PULL REQUESTS only. On branch pushes each commit
  # keeps its own run to completion, because CLAUDE.md's standing rule is that
  # EVERY COMMIT must be green on its own and `cancelled` is explicitly not a
  # pass. Those two cannot both hold under blanket cancellation: on 2026-07-30
  # three consecutive commits (6c9c432, 8f387fc, and very nearly fe2e5cb) each
  # had their run killed by the next push minutes later, so all three shipped
  # CI-unverified with nothing actually wrong with them — and the risk scales
  # with the number of agents pushing in parallel, which is exactly when the
  # per-commit signal matters most. A PR's superseded run genuinely is waste
  # (only the head matters for merge), so cancellation stays there.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    # Lint and typecheck only; pytest is the `pytest` matrix below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Python version comes from .python-version; uv installs it if missing.
      - name: Sync uv environment (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright (strict)
        run: uv run pyright

  pytest:
    # CI-PY-SPLIT. One job ran the whole suite serially: 14m31s at 1a27804,
    # 23m42s at bd6037d, against a 30-minute ceiling already raised from 15
    # once, and the suite grows with every verb and golden. So: N jobs, each
    # running pytest's FULL collection and keeping one bin of a
    # longest-processing-time packing of the test FILES by measured seconds
    # (scripts/pytest-durations.json). Membership is derived from what pytest
    # discovers, so a new test file cannot fall outside every shard; the
    # manifest only moves balance. services/geometry is 73% of the tests, which
    # is why a split by directory could not balance.
    #
    # MEASURED on the dev container, 2026-09-25, 4605 tests: unsharded 24m21s
    # (1461 s), i.e. this box runs at about a hosted runner's pace (CI's
    # 23m42s). The three shards ran 8m36s / 7m50s / 7m28s, and shard 1 shared
    # the CPU with a `just lint`. Add ~2 min for checkout, the cached uv sync
    # and PG, and each job is ~10-11 min against its 20-minute timeout. The
    # reconcile passed over those same ledgers (4605 ran, 4605 collected).
    # When a shard passes ~14 min, raise N (matrix, the `/N` below and
    # `--expect-shards`: the self-test holds all three together) and refresh
    # the manifest with `pytest_shards.py durations`. Each extra shard costs
    # ~2 runner-minutes of setup per push, which is why N is 3 and not 5.
    #
    # N=4 since CI-TWO-LANE (2026-09-30), because this job is now the critical
    # path of a lane with a 10-minute target. Packing the committed manifest
    # (1416 s over 210 files) gives 7.9 min per shard at N=3, i.e. ~10 min with
    # setup: AT the target, not under it. N=4 gives 5.9 min (~8 min with
    # setup); N=5 would give 4.8 and is floored by test_export.py alone
    # (4.8 min), so it would buy nothing. Cost: one more job, ~2 runner-minutes.
    #
    # NB a timed-out job is reported `cancelled`, the SAME word GitHub uses for
    # a concurrency eviction — see CLAUDE.md for telling them apart.
    name: pytest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports: a red in shard 1 must not cancel shard 2's result.
      fail-fast: false
      matrix:
        # Must be 1..N for the `/N` in the Pytest step and `--expect-shards N`
        # in `pytest complete`; `pytest_shards.py --self-test` (in `just lint`)
        # refuses any drift between the three.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync uv environment (locked)
        run: uv sync --locked
      # PGTEST-GATE. 172 of the documents suite's 468 tests (37%) need REAL
      # PostgreSQL SERVER binaries — including the only check that the
      # alembic chain upgrades, downgrades and matches the models. They used
      # to skip with exit 0 when `initdb` was absent, so whether they had
      # ever run here was a question nobody could answer from a log.
      #
      # The answer, established 2026-08-28 rather than assumed: they DO run.
      # `ubuntu-latest` is Ubuntu 24.04 and that image ships PostgreSQL 16.15
      # (actions/runner-images images/ubuntu/Ubuntu2404-Readme.md), whose
      # server binaries live at /usr/lib/postgresql/16/bin — exactly the
      # Debian fallback conftest.py already searched. So this step adds no
      # test time; it makes an invisible dependency explicit.
      #
      # It is worth a step anyway because the dependency MOVES: `-latest`
      # tracks the newest stable image (26.04 is already in public preview)
      # and image contents are not an API. Three properties, in order:
      #   1. it PRINTS what it found, so the log answers the question;
      #   2. it INSTALLS postgresql if the image ever stops shipping it, so a
      #      future image bump degrades to +30s rather than to a red build;
      #   3. it FAILS if it still cannot find initdb — no silent third path.
      # The refusal in services/documents/tests/conftest.py is independent of
      # all three: if this step were deleted tomorrow, a missing server would
      # still be red, not a quiet 37% coverage loss. Every shard runs it,
      # because which shard holds the documents files is up to the packing.
      - name: Resolve PostgreSQL server binaries (PGTEST-GATE)
        run: |
          set -euo pipefail
          resolve() {
            if command -v initdb >/dev/null 2>&1; then
              dirname "$(command -v initdb)"
            else
              # Debian/Ubuntu keep server binaries off PATH, one dir per
              # major version. Highest version wins, matching conftest.py.
              ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1
            fi
          }
          bin="$(resolve || true)"
          echo "image-provided server binaries: ${bin:-<none>}"
          if [ -z "$bin" ] || [ ! -x "$bin/initdb" ]; then
            echo "::warning::no PostgreSQL server binaries in the runner image; installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            bin="$(resolve || true)"
          fi
          if [ -z "$bin" ] || [ ! -x "$bin/initdb" ]; then
            echo "FATAL: no initdb after install; the documents suite would lose 172 tests"
            exit 1
          fi
          echo "PG_BIN_DIR=$bin" >> "$GITHUB_ENV"
          echo "resolved PG_BIN_DIR=$bin -> $("$bin/initdb" --version)"
      - name: Pytest (this shard)
        env:
          # Belt to the CI-detection braces in conftest.py: state the
          # requirement here too, so this job's posture is readable in this
          # file rather than inferred from a variable GitHub happens to set.
          LOFT_REQUIRE_PG: "1"
        run: >-
          uv run python scripts/pytest_shards.py run
          --shard "${{ matrix.shard }}/4"
          --ledger "$RUNNER_TEMP/pytest-ledger/shard-${{ matrix.shard }}.json"
      # The ledger is written at session finish whatever the test outcome, so a
      # red shard still hands one in. A shard killed mid-run hands in none, and
      # `pytest complete` names it.
      - name: Upload the shard's ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ledger-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-ledger/
          if-no-files-found: ignore
          retention-days: 7
          # "Re-run failed jobs" re-uploads under the same name; without this
          # v4 answers 409 and the re-run goes red for a reason unrelated to
          # the tests. `pytest complete` then reads the fresh ledger beside the
          # passing shards' ledgers from the first attempt.
          overwrite: true

  pytest-complete:
    # The check the packing cannot make about itself. It refuses unless every
    # shard 1..4 handed in a ledger, all of them collected the same suite
    # (otherwise they packed different partitions), no test ran twice, and what
    # ran is exactly what was collected. That is the defect class sharding
    # introduces: a dropped matrix entry, or a shard that died after collection,
    # leaves tests nobody ran while every job that did run is green. Stdlib
    # only, no uv environment, ~20 s. It runs on red shards too, so a red run
    # still reports its coverage.
    name: pytest complete
    needs: pytest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-ledger-*
          path: ${{ runner.temp }}/pytest-ledgers
          merge-multiple: true
      - name: Every collected test ran in exactly one shard
        run: >-
          python3 scripts/pytest_shards.py check
          --ledgers "$RUNNER_TEMP/pytest-ledgers"
          --expect-shards 4
          --workflow .github/workflows/ci.yml
      # A red shard fails its own job. This makes the aggregate say so too, so
      # `pytest complete` alone is enough as a required check.
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.pytest.result }}
        run: |
          echo "pytest shards: $SHARDS"
          test "$SHARDS" = success

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: ESLint + Prettier check
        run: pnpm run lint
      - name: Typecheck
        run: pnpm -r --if-present run typecheck
      - name: Unit tests
        run: pnpm -r --if-present run test

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync uv environment (locked)
        run: uv sync --locked
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install just
        run: uv tool install rust-just
      - name: Contract drift check
        run: just gen-check

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate base compose config
        run: docker compose config -q
      - name: Validate dev-overlay compose config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      # Structural invariants from the 2026-07-24 audit (G1: geometry S3 creds
      # match MinIO's; G3: documents/geometry never host-published in the base
      # file, dev-overlay debug ports loopback-only). Stdlib-only, renders via
      # `docker compose config` — no daemon, no image pulls, no Python deps.
      - name: Compose invariants (audit G1/G3 guard)
        run: python3 scripts/check-compose.py
      # Every Dockerfile COPY source survives .dockerignore, AND every uv
      # workspace member a service depends on is COPYed at all. Stdlib, no
      # daemon, ~50ms — and it is the ONLY place either class can be caught
      # before the image build, which the blocked registry puts out of local
      # reach: LIC-2's scripts/corresponding_source.py had no negation and
      # failed all three image builds for two commits, visible only in
      # `deploy-path`, and `loft-wire` did the same on 2026-09-15 by being a
      # transitive dependency nobody added a COPY for.
      - name: Build-context reachability (+ prove the gate can fail)
        run: |
          python3 scripts/check-build-context.py --self-test
          python3 scripts/check-build-context.py
      # Every push-triggered workflow keys its concurrency group per COMMIT.
      # Same class as the check above and the same reason it lives in a fast
      # job: a concurrency expression cannot be exercised locally, and it only
      # misbehaves when two pushes land close together — so deploy-path.yml
      # stayed keyed on the ref for two weeks after this file and e2e.yml were
      # converted, silently risking the only image-build evidence a commit can
      # have (CI-2, 2026-08-15). Stdlib, no daemon, ~60ms.
      - name: Workflow concurrency keying (+ prove the gate can fail)
        run: |
          python3 scripts/check-workflow-concurrency.py --self-test
          python3 scripts/check-workflow-concurrency.py
      # A context used where it is NOT AVAILABLE is rejected by GitHub at
      # run-creation: the run is created with `total_jobs: 0` and zero
      # duration, and the entire file never executes. `${{ runner.temp }}` in a
      # job-level `env:` did that to deploy-path.yml on 2026-09-15, taking its
      # jobs down with it. Valid YAML, no duplicate keys, correct structure —
      # nothing else we run can see it. Stdlib + PyYAML, ~40ms.
      - name: Workflow context availability (+ prove the gate can fail)
        run: |
          python3 scripts/check-workflow-contexts.py --self-test
          python3 scripts/check-workflow-contexts.py
      # The full lane's verdict job is named `full lane complete` only when the
      # commit it proved is the commit GitHub posts the check on (a dispatch
      # with `-f sha` posts on the ref's TIP). A plain name there would put a
      # green check on an untested commit. Stdlib + PyYAML, ~0.1s.
      - name: Full-lane verdict names its commit (+ prove the gate can fail)
        run: |
          python3 scripts/check-dispatch-verdict.py --self-test
          python3 scripts/check-dispatch-verdict.py
      # No mutation/ablation/debug marker survives into committed source.
      # Mutation testing is mandatory here, so an agent stopped mid-mutation
      # leaves a defect that is by construction invisible to every gate except
      # the one it was aimed at: on 2026-08-14 a `// <marker>: always 0` in
      # apps/web/e2e/diagnostics.ts passed lint, pyright and 1598 unit tests
      # and turned the e2e workflow red for ten commits (docs/RETRO.md §4b).
      # It belongs in this job rather than `python` because it needs no uv
      # environment at all — stdlib, no deps, ~700ms over 877 files — so the
      # signal arrives in the fastest job we have.
      - name: Mutation/debug markers in source (+ prove the gate can fail)
        run: |
          python3 scripts/check-mutation-markers.py --self-test
          python3 scripts/check-mutation-markers.py
      # A Tailwind utility this theme cannot generate emits NO rule — no
      # warning, no build error — so the element gets no style and measures
      # zero. `w-32` on a progress bed (the spacing scale is closed at 12) cost
      # real debugging time on 2026-08-28: the DOM looked perfect, every
      # attribute was right, and Playwright called the progressbar hidden.
      # Same reasoning as its neighbours for living in the fast job: stdlib
      # only, no node, no uv environment, ~0.9s over 429 scanned files.
      - name: Tailwind utilities the theme cannot emit (+ prove the gate can fail)
        run: |
          python3 scripts/check-tailwind-scale.py --self-test
          python3 scripts/check-tailwind-scale.py
      # `check-flow-cost.py` reads apps/web/e2e as a transcript of real gestures
      # and is what the frontend REDESIGN loop steers by, so a silent zero in it
      # aims a whole wave at the wrong surface. Its self-test found three such
      # zeros before it shipped — a `({ page })` destructuring brace read as the
      # test body, a TypeScript object-literal parameter type read as a function
      # body (which made the canonical create-a-part journey report ZERO), and
      # `test.describe` counted beside the tests it contains. The drag-collapse
      # and typed-param cases carry negative controls, so a rule that stops
      # doing anything fails loudly rather than passing vacuously. Same
      # reasoning as its neighbours for living here: stdlib only, ~150ms.
      - name: Journey gesture cost (+ prove the gate can fail)
        run: python3 scripts/check-flow-cost.py --self-test
      # AIRGAP-1. README.md sells "the whole stack can run air-gapped" and
      # docs/VISION.md builds two of four structural advantages on it; nothing
      # graded the claim, and it was FALSE — every service boots through
      # py_kit.create_app, whose FastAPI(...) left docs_url/redoc_url at their
      # defaults, so /docs on the gateway's published port sourced swagger-ui
      # from cdn.jsdelivr.net and /redoc pulled fonts.googleapis.com. Those
      # URLs live inside the fastapi package, never in our tree, so no grep of
      # our own strings could ever have found them — only a structural check on
      # the construction call. Six surfaces (python string literals, the
      # FastAPI call, web source + markup, fonts, compose, Dockerfile runtime
      # directives), each with a count floor so a collapsed walk REFUSES
      # instead of passing. Belongs in this job for the same reason as its
      # neighbours: stdlib only, no daemon, no uv environment, ~2.3s.
      - name: Air-gap — nothing the running product needs is on the internet
        run: |
          python3 scripts/check-air-gap.py --self-test
          python3 scripts/check-air-gap.py
      # FILE-SIZE-RATCHET. No hand-written .py/.ts/.tsx file may pass 1,500
      # lines, and the ones already over it (scripts/file-size-allowlist.json)
      # may not grow; an entry above its file's real size fails too, so the
      # list only shrinks. PartPage.tsx reached 6,502 lines a few at a time
      # because nothing pushed back. Stdlib + git, ~0.3s (+ ~1.6s self-test).
      - name: Source file size ratchet (+ prove the gate can fail)
        run: |
          python3 scripts/check-file-size.py --self-test
          python3 scripts/check-file-size.py
      # scripts/web-smoke.sh asserts the compose stack ENDS AT THE APP — the
      # entry document, the hashed bundle it names, the SPA fallback, a
      # transparent /api proxy, and no CDN-loading FastAPI explorer. Those
      # assertions only run inside `deploy-path`, which needs a Docker daemon
      # and takes ~20 minutes, so a bash typo in them would be discovered one
      # slow round trip at a time. This runs the checker against stub servers
      # that reproduce the serving rules, and then against one stub per defect
      # (a greedy fallback, an HTML bundle, a 13-byte bundle, a missing proxy,
      # a 502 proxy, a directory listing, a live /docs, a gateway that 404s
      # everything), demanding a failure each time — so every assertion in that
      # script has been watched failing before it is trusted on a runner. It
      # found a real defect on its first run: `set -o pipefail` made a grep
      # that matched nothing abort the whole script with an EMPTY stderr.
      #
      # ~11s, and it is here rather than in `just lint` deliberately: that is
      # ten seconds on every agent's every lint to guard a file that changes
      # rarely, and this job gives the same verdict on every push. Run it by
      # hand with `just web-smoke-selftest` when editing the script.
      - name: Browser-path assertions (prove the deploy-path gate can fail)
        run: scripts/web-smoke.sh --self-test
      # backup-restore-drill retries its image build ONCE on BuildKit's
      # "error reading from server: EOF" (e3bd6aa). A retry policy is only
      # safe while it stays narrow, and the only runs that exercise it are the
      # ~20-minute deploy-path ones. So this replays canned daemon output
      # through a fake `docker` and demands that the EOF retries once, loudly,
      # and that a reset, a refused connection, a Dockerfile error, a failing
      # RUN step and a second EOF do NOT. Bash only, ~0.3s.
      - name: Build-retry policy (+ prove it refuses everything but the EOF)
        run: scripts/compose-build-retry.sh --self-test
      # The pytest shard planner and its reconcile, including that the
      # `pytest` matrix, its `/N` and `--expect-shards` agree. Here so that
      # drift is red in a minute rather than after the shards. Stdlib, ~60ms.
      - name: Pytest shard planner (+ prove the reconcile can fail)
        run: python3 scripts/pytest_shards.py --self-test

  licences:
    # LIC-3 — the no-GPL rule, enforced by reading the BINARIES we ship.
    #
    # It was previously enforced by review, i.e. by reading package metadata,
    # and the OCP wheel is the proof that cannot work: `License: Apache-2.0` in
    # METADATA, "JBIG-KIT 2.1 ... Licence: GPL" inside the .so it vendors. A
    # metadata-only scan called that tree fully permissive, which is how a
    # GPL-2.0 library survived to release week (LIC-1, docs/LICENSING.md §4).
    #
    # No docker daemon: the gate reads the uv-synced environment directly, so
    # it runs here in the fast workflow rather than waiting on deploy-path.
    # The image-side assertions (the strip actually took; the label matches the
    # contents; OCCT still returns the analytic volume) run inside the Docker
    # build itself — see deploy/docker/service.Dockerfile.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync uv environment (locked)
        run: uv sync --locked
      # The dev environment legitimately still contains jbigkit — the strip
      # happens during the image build — so this profile tolerates it ONLY
      # because the inventory marks it strip-in-image and names a strip script
      # that provably targets it. Everything else must be classified.
      #
      # Since LIC-2 this step also checks the corresponding-source manifest
      # (deploy/licenses/corresponding-source.json) against these binaries. If
      # a wheel bump moves OCCT off 7.9.3, the pinned URLs, digests and the
      # §6(c) written offer we publish all start describing source that does
      # not correspond to what we ship — so it fails here, before a release,
      # rather than being discovered by a recipient.
      - name: Licence gate (source environment)
        run: python3 scripts/check-licences.py --profile source-env
      # A gate nobody has seen fail is not a gate — this repo has been bitten
      # by that exact class three times. The self-test runs the IMAGE profile
      # against the real, unstripped GPL library (must fail, naming libjbig),
      # then applies the production strip script and runs it again (must pass).
      # It then does the same for the corresponding-source half: the committed
      # manifest must pass, every component's version bumped by hand must fail,
      # and a manifest whose version cannot be READ must fail rather than pass
      # quietly (a rotted detector is the failure mode that shows up green).
      # It fails if ANY of those comes out the wrong way.
      - name: Prove the gate can fail (negative + positive control)
        run: python3 scripts/check-licences.py --self-test

  e2e-smoke:
    # THE BROWSER HALF OF THE PER-COMMIT LANE (CI-TWO-LANE, 2026-09-30).
    #
    # The five spec files in SMOKE_SPECS (scripts/e2e-shard-plan.py, which also
    # says why each is there): the sketch -> extrude -> save -> reload journey,
    # driven through the UI and through the gateway, against the same native
    # stack the full lane uses. Everything else in apps/web/e2e runs in the
    # full lane (e2e.yml), before main.
    #
    # `--smoke` is expanded by scripts/e2e.sh into anchored file patterns, and
    # the planner first re-asks `playwright test --list` that they select
    # EXACTLY those five files. That is load-bearing: a positional filter that
    # matches nothing is dropped by Playwright without a word, so a renamed
    # smoke spec would otherwise leave a green, shorter smoke. The static half
    # (on disk, measured, within budget) is in `just lint`.
    #
    # MEASURED on the dev container at 05bc462+: 17 tests, 165 s wall for
    # scripts/e2e.sh (stack boot + Vite + specs) at 1-min load 5.8 on 4 CPUs.
    # A hosted runner adds ~3-4 min of setup (uv sync from cache, pnpm, the
    # Chromium apt deps), so expect ~6-7 min. 15 is headroom, not a
    # prediction; a job timeout reads `cancelled`, so guessing low is worse.
    name: e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync uv environment (locked)
        run: uv sync --locked
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Resolve the pinned Playwright version
        id: pw
        run: |
          version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"
      # The SAME cache key the full lane's shards use.
      - name: Cache the browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: pnpm --filter @loft/web exec playwright install --with-deps chromium
      # Same flags as a full-lane shard: --forbid-only, and NO retries
      # (GATE-1a). A smoke people learn to re-run is worse than no smoke.
      - name: Smoke specs (sketch -> extrude -> save -> reload)
        timeout-minutes: 12
        env:
          E2E_JSON_REPORT: ${{ runner.temp }}/playwright-smoke.json
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs-smoke
        run: >-
          scripts/e2e.sh --web-only --
          --smoke
          --forbid-only
      - name: The run must not have dirtied the tree
        if: always()
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::the smoke run modified the working tree:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "tree clean after the run"
      - name: Upload traces/screenshots from a failing run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the service logs and the JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-diagnostics
          path: |
            ${{ runner.temp }}/e2e-logs-smoke
            ${{ runner.temp }}/playwright-smoke.json
          if-no-files-found: warn
          retention-days: 7
      # LAST, for the reason the full lane's verdicts are last: a tail of the
      # job log is the only channel into a red run from the dev container. It
      # ends on `job.status`, not on the block, so a red job's last line never
      # reads GREEN (CI-VERDICT-HANG-1; scripts/e2e-job-verdict.sh).
      - name: Verdict (kept last so a tail of the job log finds it)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          scripts/e2e-job-verdict.sh
          "$RUNNER_TEMP/e2e-logs-smoke/verdict.txt"
          "Smoke specs (sketch -> extrude -> save -> reload)"
