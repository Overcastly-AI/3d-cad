# Loft CI — lint / typecheck / unit tests, contract drift, compose validation.
#
# Jobs (all independent, run in parallel):
#   python    — ruff (lint + format), pyright strict, pytest across the uv workspace
#   ts        — eslint + prettier, tsc typecheck, vitest across the pnpm workspace
#   contracts — `just gen-check`: regenerate OpenAPI contracts + TS client into a
#               tempdir and diff against the committed output (fails on drift)
#   compose   — `docker compose config -q` for the base stack and base+dev
#               overlay, plus scripts/check-compose.py (audit G1/G3 invariants:
#               geometry S3 creds == MinIO's; internal services unpublished)
#
# Notes:
# - The geometry golden suite and Playwright e2e get their OWN workflow later
#   (separate backlog items: golden harness, web shell) — they need built
#   artifacts / a running stack and their own time budget, not a skipped gate.
# - The uv cache is keyed on uv.lock on purpose: when OCP lands in the Python
#   env its wheels are ~700MB, and that cache is what keeps the python and
#   contracts jobs from re-downloading them on every run (CLAUDE.md recipe).
# - The repo is small enough that every job runs on every push; per-package
#   path filtering is a later optimization once job times warrant it.

name: ci

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Python version comes from .python-version; uv installs it if missing.
      - name: Sync uv environment (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright (strict)
        run: uv run pyright
      - name: Pytest
        run: uv run pytest

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: ESLint + Prettier check
        run: pnpm run lint
      - name: Typecheck
        run: pnpm -r --if-present run typecheck
      - name: Unit tests
        run: pnpm -r --if-present run test

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync uv environment (locked)
        run: uv sync --locked
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install just
        run: uv tool install rust-just
      - name: Contract drift check
        run: just gen-check

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate base compose config
        run: docker compose config -q
      - name: Validate dev-overlay compose config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      # Structural invariants from the 2026-07-24 audit (G1: geometry S3 creds
      # match MinIO's; G3: documents/geometry never host-published in the base
      # file, dev-overlay debug ports loopback-only). Stdlib-only, renders via
      # `docker compose config` — no daemon, no image pulls, no Python deps.
      - name: Compose invariants (audit G1/G3 guard)
        run: python3 scripts/check-compose.py

  geometry-minio-smoke:
    # Real-MinIO cross-process smoke for the §7.8 mesh-store swap (audit F6):
    # the property the swap exists for — evaluate on one process/replica, fetch
    # on another against a shared object store — cannot be proven in-process by
    # moto. This job boots a live MinIO with the mesh bucket provisioned, points
    # S3_URL/S3_BUCKET/creds at it, and runs the geometry S3 suite with the
    # cross-process smoke ENABLED via LOFT_MINIO_SMOKE=1. The default `python`
    # job runs the same file with the marker UNSET, so that smoke skips there and
    # the store's cross-process correctness is gated exactly once, here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Reuse the compose-defined MinIO + one-shot bucket bootstrap (DRY: same
      # service/bucket the dev stack uses). `--wait` blocks until MinIO is
      # healthy and minio-init has created the bucket (exit 0).
      - name: Boot MinIO + provision the mesh bucket
        run: docker compose up -d --wait minio minio-init
      - name: Sync uv environment (locked)
        run: uv sync --locked
      - name: Cross-process mesh-store smoke (real MinIO)
        env:
          LOFT_MINIO_SMOKE: "1"
          # Host-mapped MinIO (compose publishes 9000); creds are the compose
          # MinIO root user/password defaults, bucket is the S3_BUCKET default.
          S3_URL: http://localhost:9000
          S3_BUCKET: loft
          S3_ACCESS_KEY_ID: loft-minio
          S3_SECRET_ACCESS_KEY: loft-minio-dev-only
        run: uv run pytest services/geometry/tests/test_s3_store.py -v
      - name: Tear down MinIO
        if: always()
        run: docker compose down -v
