# The toolchain `uv sync` needs to build planegcs from vendor/planegcs
# (SKETCH-SOLVE-HEAP-ORDER, docs/RESEARCH.md §2). The PyPI wheel orders parts
# of a solve by memory address; Loft builds the patched source instead, so
# every job that syncs the uv environment needs Eigen 3 and Boost headers. The
# runner already has g++ and CMake. Once uv's cache holds the built wheel the
# headers go unused, but a cold cache must not turn the job red.
name: planegcs build prerequisites
description: Eigen 3 and Boost headers for building the vendored planegcs.
runs:
  using: composite
  steps:
    - name: Install Eigen 3 + Boost headers
      shell: bash
      run: |
        if [ -f /usr/include/eigen3/Eigen/QR ] && [ -f /usr/include/boost/graph/adjacency_list.hpp ]; then
          echo "planegcs build prerequisites already present"
        else
          # An apt mirror can stall a runner for the job's whole timeout (seen
          # 2026-10-22: 20 min on one shard), so each attempt gets 3 min and
          # a stall is retried rather than waited out.
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update -qq &&
              sudo timeout 180 apt-get install -y -qq --no-install-recommends libeigen3-dev libboost-dev; then
              exit 0
            fi
            echo "::warning::planegcs prerequisites: attempt $attempt stalled or failed; retrying"
          done
          exit 1
        fi
