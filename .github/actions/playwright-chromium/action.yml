# Chromium for the Playwright suite: the browser binary (cached by the pinned
# Playwright version) and the apt packages it needs. Chromium only, because
# playwright.config.ts declares no other browser, so installing the rest would
# be minutes of download nothing runs. Every e2e job uses this (ci.yml's smoke,
# e2e.yml's shards, dist-bundle and auth-short-ttl), and they share one cache key.
#
# ── 2026-10-22: bounded, retried, apt only when something is missing ───────
#
# Two full-lane shards were lost to this step alone: `8b8d8f6` (run
# 39819343469), shard 6/7, spent 11.4 min here plus 2.9 min on the planegcs apt
# step and the 45-min job limit cancelled it 30 min into its tests. `7479bde`,
# shard 5/6, spent 9.8 min here and was cancelled the same way. A normal
# install takes 10-60 s.
#
# The step was `playwright install --with-deps chromium`. The browser cache
# only covers the binary, so `--with-deps` ran an unbounded
# `apt-get update && apt-get install` of ~30 packages on EVERY job, cache hit
# or not. On the same runner the planegcs apt step took 2.9 min against its
# usual seconds, so that runner's apt mirror was slow. That makes the apt half
# the likely stall (the logs that would separate apt from download cannot be
# reached from the sandbox). Both halves are now bounded, the same way a510b6a
# bounds planegcs-build-deps:
#   - apt runs only when `dpkg-query` reports a package missing. The list is
#     what `playwright install-deps --dry-run` would install, so it follows a
#     Playwright bump. Each apt command gets 3 min, with 3 attempts.
#   - the download gets 4 min per attempt, with 3 attempts. GNU `timeout` signals
#     the whole process group, so Playwright's forked downloader dies with it.
#     An interrupted install leaves no completion marker and is fetched again.
# Each phase logs its own time and whether the cache hit, so the next slow
# runner will show which half was slow.
#
# ── 2026-10-23: the apt half comes from a .deb cache ───────────────────────
#
# Run 39980520437 at 27c44a5: e2e smoke spent 6m08s in planegcs-build-deps
# and 7m23s in this action, then hit its job timeout (cancelled). Retries had
# bounded each stall without taking the mirror off the path. So the .debs the
# missing packages need are now cached (actions/cache, keyed on the runner
# image, the Playwright version and the packages' candidate versions) and go in
# with `dpkg -i`; scripts/ci-apt-debs.sh has the mechanics and a stubbed
# self-test. Bounded apt stays as the cold-cache fallback, and the job that
# takes it saves what it downloaded. The browser download keeps its bounds.
name: Playwright Chromium
description: Cached Chromium binary + its apt dependencies (.deb cache, bounded apt fallback).
runs:
  using: composite
  steps:
    - name: Resolve the pinned Playwright version
      id: pw
      shell: bash
      run: |
        version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Playwright $version"
    - name: Cache the browser binaries
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Plan the Chromium apt dependencies
      id: deps
      shell: bash
      env:
        PW_VERSION: ${{ steps.pw.outputs.version }}
      run: |
        pw=apps/web/node_modules/.bin/playwright
        # The dry run prints: sh -c "apt-get update&& apt-get install -y --no-install-recommends <pkgs>"
        plan=$("$pw" install-deps --dry-run chromium)
        pkgs=$(sed -n 's/.*--no-install-recommends \([^"]*\)".*/\1/p' <<<"$plan")
        if [ -z "$pkgs" ]; then
          # A Playwright bump changed the dry-run format. Stop here with a clear
          # error instead of skipping deps and failing later at browser launch.
          echo "::error::could not read the apt package list from: $plan"
          exit 1
        fi
        echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2086 # word splitting of the package list is intended
        echo "key=chromium-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}-pw$PW_VERSION-$(scripts/ci-apt-debs.sh key $pkgs)" >> "$GITHUB_OUTPUT"
    - name: Restore the Chromium .debs
      id: debs
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-debs/chromium
        key: ${{ steps.deps.outputs.key }}
    - name: Chromium apt dependencies (deb cache, apt fallback)
      id: install-deps
      shell: bash
      env:
        PKGS: ${{ steps.deps.outputs.pkgs }}
        CACHE_HIT: ${{ steps.debs.outputs.cache-hit }}
      run: |
        echo "deb cache hit: ${CACHE_HIT:-false}"
        # shellcheck disable=SC2086 # word splitting of the package list is intended
        scripts/ci-apt-debs.sh install "$RUNNER_TEMP/apt-debs/chromium" $PKGS
    - name: Save the Chromium .debs
      if: steps.install-deps.outputs.seeded == 'true' && steps.debs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/apt-debs/chromium
        key: ${{ steps.deps.outputs.key }}
    - name: Install Chromium
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        start=$SECONDS
        echo "browser cache hit: ${CACHE_HIT:-false}"
        for attempt in 1 2 3; do
          if timeout --kill-after=10 240 apps/web/node_modules/.bin/playwright install chromium; then
            echo "Chromium ready in $((SECONDS - start)) s (attempt $attempt)"
            exit 0
          fi
          echo "::warning::Chromium download: attempt $attempt stalled or failed after $((SECONDS - start)) s; retrying"
        done
        exit 1
