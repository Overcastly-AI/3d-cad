# Alembic config for the DOCUMENTS schema (parts, feature tree —
# docs/design/feature-tree.md §5). The database URL is NOT stored here:
# env.py reads POSTGRES_URL from the environment (12-factor), same variable
# the service itself uses.
#
#   POSTGRES_URL=postgresql://... uv run alembic -c services/documents/alembic.ini upgrade head

[alembic]
script_location = %(here)s/alembic
# Frozen-timestamp-free, name-first version files (0001_parts, ...).
file_template = %%(rev)s_%%(slug)s
