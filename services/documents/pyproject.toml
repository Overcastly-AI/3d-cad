[project]
name = "loft-documents"
version = "0.1.0"
description = "Loft documents service: parts/assemblies, feature trees, versioning"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "loft-py-kit",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documents"]
