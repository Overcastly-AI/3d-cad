[project]
name = "loft-geometry"
version = "0.1.0"
description = "Loft geometry service: OCCT feature evaluation, tessellation, export"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "loft-py-kit",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "build123d>=0.11.1",
    "planegcs>=0.8.0",
    "numpy>=2.0",
    # BSD-3-Clause, tiny, no native code — pins BLAS to one thread around the
    # assembly solve so the FP reduction order (hence placements) is bitwise
    # reproducible across machines (RESEARCH §9). License-clean, no GPL.
    "threadpoolctl>=3.6",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geometry"]
