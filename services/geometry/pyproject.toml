[project]
name = "loft-geometry"
version = "0.1.0"
description = "Loft geometry service: OCCT feature evaluation, tessellation, export"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "loft-py-kit",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "build123d>=0.11.1",
    "planegcs>=0.8.0",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geometry"]
