# Alembic config for the GATEWAY schema (users/identity — RESEARCH §3).
# The database URL is NOT stored here: env.py reads POSTGRES_URL from the
# environment (12-factor), same variable the service itself uses.
#
#   POSTGRES_URL=postgresql://... uv run alembic -c services/gateway/alembic.ini upgrade head

[alembic]
script_location = %(here)s/alembic
# Frozen-timestamp-free, name-first version files (0001_users.py, ...).
file_template = %%(rev)s_%%(slug)s
