[project]
name = "loft-gateway"
version = "0.1.0"
description = "Loft gateway service: auth, REST aggregation, WebSocket fan-out"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "loft-py-kit",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx2>=2.5",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
