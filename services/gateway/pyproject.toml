[project]
name = "loft-gateway"
version = "0.1.0"
description = "Loft gateway service: auth, REST aggregation, WebSocket fan-out"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "loft-py-kit",
    "fastapi>=0.115",
    "anyio>=4",
    "uvicorn>=0.32",
    "httpx2>=2.12",  # GHSA-h4x7-gw46-3wm6 (multipart header injection), GHSA-8xx6-hgc6-gc2m
    "argon2-cffi>=23.1",
    "pyjwt>=2.15",  # GHSA-8wjv-2p76-3863: nested-header RecursionError escaped InvalidTokenError
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "email-validator>=2.2",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
