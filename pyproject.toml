# Root of the uv workspace (RESEARCH.md §3/§6). Not a package itself.
[project]
name = "loft-workspace"
version = "0.0.0"
description = "Loft monorepo workspace root (tooling only — services and packages are the members)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
# Glob tolerates not-yet-created services; py-kit is the first Python member.
members = ["services/*", "packages/py-kit"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1.400",
    # Workspace members under test + shared test deps: `uv run pytest` from the
    # root needs the members importable in the single workspace venv.
    "loft-py-kit",
    "loft-gateway",
    "loft-documents",
    "loft-geometry",
    "httpx2>=0.1", # fastapi/starlette TestClient transport (httpx is deprecated there)
    "aiosqlite>=0.20",
    # In-process S3 mock (Apache-2.0; server extra pulls flask/werkzeug, both
    # BSD-3 — no GPL) — the `server` extra runs moto's ThreadedMotoServer, a
    # real in-process S3 HTTP endpoint, so the geometry store's boto3 put/get
    # travels a genuine HTTP round-trip against a MinIO-shaped (path-style)
    # endpoint without a docker daemon. The real-MinIO cross-process 2-worker
    # smoke stays CI-gated (feature-tree §7.8): moto proves the S3 code path,
    # not the cross-process topology.
    "moto[s3,server]>=5.0",
]

[tool.uv.sources]
loft-py-kit = { workspace = true }
loft-gateway = { workspace = true }
loft-documents = { workspace = true }
loft-geometry = { workspace = true }

# ---------------------------------------------------------------------------
# Shared lint/type/test config — single source of truth for all Python members
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "packages/contracts", "packages/ts-client"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pyright]
include = ["services", "packages", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "packages/contracts", "packages/ts-client"]
typeCheckingMode = "strict"  # no untyped defs in services/packages (CLAUDE.md)
# FastAPI/pytest register functions via decorators (@app.get, @app.exception_handler,
# @pytest.fixture); pyright can't see that access and would flag every handler.
reportUnusedFunction = false
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
# importlib mode: test module names may repeat across workspace members
# (e.g. every member can have tests/test_config.py) without collisions.
# `-m 'not benchmark'`: the geometry perf suite's DETAILED timing tier
# (tests/test_benchmarks.py, `benchmark`-marked) is heavy median-of-N work and
# opt-in — the default suite still runs its generous, asserted CI tripwires
# (unmarked). Run the detailed tier explicitly with `just bench` /
# `uv run pytest -m benchmark` (a CLI `-m` overrides this default).
addopts = "-q --import-mode=importlib -m 'not benchmark'"
markers = [
    "benchmark: opt-in detailed perf timings (median/p95); excluded from the default suite",
    # Cross-service tests that boot >1 real service app in-process (e.g. the
    # assembly-import chain: gateway -> geometry -> documents over ASGI
    # transports). INCLUDED in the default suite — the marker exists so a
    # kernel-free slice can deselect them (`-m 'not integration'`), never to
    # hide them from CI.
    "integration: multi-service in-process chain tests (real OCCT); default-included",
]
